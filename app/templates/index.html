<!DOCTYPE html>
<html>
<head>
  <title>Chat with JWT Auth + Voice + Loading + Markdown</title>
  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<h2 id="loginTitle">Login</h2>
<div id="loginForm">
  <input id="email" placeholder="Email" />
  <input id="password" placeholder="Password" type="password" />
  <button onclick="doLogin()">Login</button>
</div>

<div id="chat" style="display:none;">
  <h3>Room: default</h3>
  <div id="messages" style="border:1px solid #ccc; height:300px; overflow:auto; padding:5px;"></div>

  <input id="inputMsg" placeholder="Type message..." />
  <button id="textButton" onclick="sendMessage()">Send</button>

  <br><br>
  <button id="recordButton" onclick="toggleRecording()">Start Recording</button>

  <br><br>
  <button onclick="logout()">Logout</button>
</div>

<script>
  let socket;
  let token = localStorage.getItem('chat_token');
  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;

  if (token) {
    startChat();
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('loginTitle').textContent = 'You are logged in';
  }

  async function doLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/sludgify/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, provider: 'auth_internal' })
    });

    const data = await res.json();
    if (data.token) {
      token = data.token.access_token;
      localStorage.setItem('chat_token', token);
      startChat();
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('loginTitle').textContent = 'You are logged in';
    } else {
      alert('Login failed: ' + (data.error || 'Unknown error'));
    }
  }

  function startChat() {
    document.getElementById('chat').style.display = 'block';
    socket = io(window.location.origin);

    socket.on('connect', () => {
      socket.emit('join', { room: 'default', token });
    });

    socket.on('chat_history', (messages) => {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';
      messages.forEach(msg => {
        if (typeof msg === 'object' && msg.response_message) {
          addMessageWithLinks(msg);
        } else {
          const div = document.createElement('div');
          div.textContent = msg;
          messagesDiv.appendChild(div);
        }
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    socket.on('message_with_links', (data) => {
      enableAllButtons();
      addMessageWithLinks(data);
    });

    socket.on('disconnect', (reason) => {
      console.log('Disconnected: ' + reason);
      if (reason === 'io server disconnect') {
        alert('You were disconnected by the server.');
        localStorage.removeItem('chat_token');
        location.reload();
      }
    });
  }

  function addMessageWithLinks(data) {
    const messagesDiv = document.getElementById('messages');

    const originalMsgDiv = document.createElement('div');
    originalMsgDiv.style.fontWeight = 'bold';
    originalMsgDiv.style.marginBottom = '5px';
    originalMsgDiv.innerHTML = `<strong>${data.username}:</strong><br>${marked.parse(data.original_message)}`;
    messagesDiv.appendChild(originalMsgDiv);

    const responseMsgDiv = document.createElement('div');
    responseMsgDiv.style.whiteSpace = 'pre-wrap';
    responseMsgDiv.style.marginBottom = '5px';
    responseMsgDiv.innerHTML = `Bot:<br>${marked.parse(data.response_message)}`;
    messagesDiv.appendChild(responseMsgDiv);

    if (data.links && data.links.length > 0) {
      data.links.forEach((link, i) => {
        const btn = document.createElement('button');
        btn.textContent = `Download File ${i + 1}`;
        btn.style.margin = '4px';
        btn.onclick = () => {
          window.open(link, '_blank');
        };
        messagesDiv.appendChild(btn);
      });
    }

    messagesDiv.appendChild(document.createElement('hr'));
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('inputMsg');
    const msg = input.value.trim();
    if (msg && socket) {
      disableAllButtons('Sending...');
      socket.emit('message', { room: 'default', msg, token, type: 'text' });
      input.value = '';
    }
  }

  async function toggleRecording() {
    const recordButton = document.getElementById('recordButton');

    if (isRecording) {
      mediaRecorder.stop();
      recordButton.textContent = 'Start Recording';
      isRecording = false;

      document.getElementById('inputMsg').disabled = false;
      document.getElementById('textButton').disabled = false;

    } else {
      if (!navigator.mediaDevices) {
        alert('Your browser does not support audio recording.');
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/m4a' });
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64AudioMessage = reader.result.split(',')[1];
          if (socket && base64AudioMessage) {
            disableAllButtons('Processing audio...');
            socket.emit('message', { room: 'default', audio: base64AudioMessage, token, type: 'voice' });
          }
        };
        reader.readAsDataURL(audioBlob);
      };

      mediaRecorder.start();
      recordButton.textContent = 'Stop Recording';
      isRecording = true;

      document.getElementById('inputMsg').disabled = true;
      document.getElementById('textButton').disabled = true;
    }
  }

  function disableAllButtons(loadingText = 'Loading...') {
    document.getElementById('textButton').disabled = true;
    document.getElementById('textButton').textContent = loadingText;

    document.getElementById('recordButton').disabled = true;
  }

  function enableAllButtons() {
    document.getElementById('textButton').disabled = false;
    document.getElementById('textButton').textContent = 'Send';

    document.getElementById('recordButton').disabled = false;

    document.getElementById('inputMsg').disabled = false;
  }

  function logout() {
    localStorage.removeItem('chat_token');
    location.reload();
  }
</script>

</body>
</html>
